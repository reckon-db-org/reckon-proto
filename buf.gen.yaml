version: v2
plugins:
  # Go bindings — committed into reckon-go's genproto/ directory.
  # Run from this repo with:
  #   buf generate --template buf.gen.yaml --output ../reckon-go
  - remote: buf.build/protocolbuffers/go
    out: genproto/gatewayv1
    opt:
      - paths=source_relative
  - remote: buf.build/grpc/go
    out: genproto/gatewayv1
    opt:
      - paths=source_relative
      - require_unimplemented_servers=false
